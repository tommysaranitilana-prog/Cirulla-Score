<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cirulla Scoreboard</title>
  <link rel="apple-touch-icon" href="icon.PNG">

<link rel="icon" type="image/png" href="icon.PNG">
<!-- Collegamento al Manifest della PWA -->
<link rel="manifest" href="manifest.json">

<!-- Script per attivare la funzione Offline su iPhone/Android -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('App pronta per l\'uso offline!'))
        .catch((err) => console.log('Errore Service Worker:', err));
    });
  }
</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cirulla">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
    .cirulla-score { font-family: 'Bebas Neue', 'Inter', sans-serif; letter-spacing: 0.02em; }
    @keyframes cirullaStreak {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      15% { transform: translateY(-6px) scale(1.15); opacity: 1; }
      75% { transform: translateY(-22px) scale(1); opacity: 1; }
      100% { transform: translateY(-34px) scale(0.9); opacity: 0; }
    }
    .cirulla-streak { animation: cirullaStreak 650ms ease-out forwards; }
    @keyframes cirullaToast { 
      0% { opacity: 0; transform: translate(-50%, -6px); } 
      12% { opacity: 1; transform: translate(-50%, 0); } 
      82% { opacity: 1; } 
      100% { opacity: 0; } 
    }
    .cirulla-toast { animation: cirullaToast 900ms ease-in-out forwards; }
  </style>
</head>
<body class="bg-black text-white antialiased select-none">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    // Componente per renderizzare le icone Lucide in HTML React
    function LucideIcon({ name, size = 18, color = "#FBF3DE", strokeWidth = 2.25, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:${color}; stroke-width:${strokeWidth};"></i>`;
          if (window.lucide) {
            window.lucide.createIcons({
              attrs: { 'stroke-width': strokeWidth },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name, size, color, strokeWidth]);

      return <span ref={ref} class={`inline-flex items-center justify-center ${className}`}></span>;
    }

    const PICCOLA_CARDS = ["A", "2", "3", "4", "5", "6"];

    function SevenIcon({ size = 18, color = "#FBF3DE" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2.5" />
          <text x="12" y="16.5" textAnchor="middle" fontSize="11" fontWeight="800" fill={color} stroke="none" fontFamily="Inter, sans-serif">7</text>
        </svg>
      );
    }

    const emptySide = () => ({
      settebello: false, primiera: false, denari: false, carte: false,
      piccola: 0, grande: false, scope: 0, buona: 0,
    });

    function sideScore(s) {
      return (
        (s.settebello ? 1 : 0) + (s.primiera ? 1 : 0) + (s.denari ? 1 : 0) + (s.carte ? 1 : 0) +
        s.piccola + (s.grande ? 5 : 0) + s.scope + (s.buona * 10)
      );
    }

    function ToggleCell({ label, iconName, active, onClick, accent, points = 1, showValue = true }) {
      return (
        <button
          onPointerDown={(e) => { e.preventDefault(); onClick(); }}
          className="relative flex flex-col items-center justify-center gap-1 rounded-2xl px-2 py-3 transition-all duration-150 active:scale-95 select-none touch-manipulation"
          style={{
            background: active ? `linear-gradient(155deg, ${accent}ee, ${accent}bb)` : "rgba(255,255,255,0.08)",
            border: active ? "1.5px solid rgba(255,255,255,0.85)" : "1.5px solid rgba(255,255,255,0.16)",
            boxShadow: active ? "0 4px 14px rgba(0,0,0,0.35)" : "none",
            touchAction: "manipulation",
          }}
        >
          <LucideIcon name={iconName} size={18} color="#FBF3DE" />
          <span className="text-[11px] tracking-wide font-semibold uppercase" style={{ color: "#FBF3DE" }}>{label}</span>
          {showValue && (
            <span className="text-[13px] font-bold" style={{ color: active ? "#FFF6DD" : "rgba(251,243,222,0.55)" }}>
              {active ? `+${points}` : "—"}
            </span>
          )}
        </button>
      );
    }

    function CustomToggleCell({ label, children, active, onClick, accent }) {
      return (
        <button
          onPointerDown={(e) => { e.preventDefault(); onClick(); }}
          className="relative flex flex-col items-center justify-center gap-1 rounded-2xl px-2 py-3 transition-all duration-150 active:scale-95 select-none touch-manipulation"
          style={{
            background: active ? `linear-gradient(155deg, ${accent}ee, ${accent}bb)` : "rgba(255,255,255,0.08)",
            border: active ? "1.5px solid rgba(255,255,255,0.85)" : "1.5px solid rgba(255,255,255,0.16)",
            boxShadow: active ? "0 4px 14px rgba(0,0,0,0.35)" : "none",
            touchAction: "manipulation",
          }}
        >
          {children}
          <span className="text-[11px] tracking-wide font-semibold uppercase" style={{ color: "#FBF3DE" }}>{label}</span>
        </button>
      );
    }

    function RunCell({ label, iconName, value, onOpen, accent }) {
      const active = value > 0;
      return (
        <button
          onPointerDown={(e) => { e.preventDefault(); onOpen(); }}
          className="relative flex flex-col items-center justify-center gap-1 rounded-2xl px-2 py-3 transition-all duration-150 active:scale-95 select-none touch-manipulation"
          style={{
            background: active ? `linear-gradient(155deg, ${accent}ee, ${accent}bb)` : "rgba(255,255,255,0.08)",
            border: active ? "1.5px solid rgba(255,255,255,0.85)" : "1.5px solid rgba(255,255,255,0.16)",
            boxShadow: active ? "0 4px 14px rgba(0,0,0,0.35)" : "none",
            touchAction: "manipulation",
          }}
        >
          <LucideIcon name={iconName} size={18} color="#FBF3DE" />
          <span className="text-[11px] tracking-wide font-semibold uppercase" style={{ color: "#FBF3DE" }}>{label}</span>
          <span className="text-[13px] font-bold" style={{ color: active ? "#FFF6DD" : "rgba(251,243,222,0.55)" }}>
            {active ? `+${value}` : "—"}
          </span>
        </button>
      );
    }

    function ScopeCell({ value, onTap, onReset, accent }) {
      const active = value > 0;
      const [burst, setBurst] = useState(null);

      const handleTap = () => {
        onTap();
        setBurst(Date.now());
      };

      return (
        <div
          className="relative flex flex-col items-center justify-center gap-1 rounded-2xl px-2 py-3 overflow-hidden select-none"
          style={{
            background: active ? `linear-gradient(155deg, ${accent}ee, ${accent}bb)` : "rgba(255,255,255,0.08)",
            border: active ? "1.5px solid rgba(255,255,255,0.85)" : "1.5px solid rgba(255,255,255,0.16)",
            boxShadow: active ? "0 4px 14px rgba(0,0,0,0.35)" : "none",
          }}
        >
          <button onPointerDown={(e) => { e.preventDefault(); handleTap(); }} className="flex flex-col items-center gap-1 w-full transition-transform duration-100 active:scale-95 touch-manipulation" style={{ touchAction: "manipulation" }}>
            <LucideIcon name="flame" size={18} color="#FBF3DE" />
            <span className="text-[11px] tracking-wide font-semibold uppercase" style={{ color: "#FBF3DE" }}>Scope</span>
            <span className="text-[13px] font-bold" style={{ color: active ? "#FFF6DD" : "rgba(251,243,222,0.55)" }}>
              {active ? `+${value}` : "—"}
            </span>
          </button>
          {active && (
            <button onPointerDown={(e) => { e.preventDefault(); e.stopPropagation(); onReset(); }} className="absolute top-1 right-1 rounded-full flex items-center justify-center touch-manipulation" style={{ width: 22, height: 22, background: "rgba(0,0,0,0.85)", border: "1.5px solid rgba(255,255,255,0.7)", touchAction: "manipulation" }}>
              <LucideIcon name="rotate-ccw" size={13} color="#FFFFFF" />
            </button>
          )}
          {burst !== null && (
            <span key={burst} onAnimationEnd={() => setBurst(null)} className="cirulla-streak pointer-events-none absolute text-[20px] font-extrabold" style={{ color: "#FFF6DD" }}>
              +{value}
            </span>
          )}
        </div>
      );
    }

    function BuonaCell({ value, onTap, onReset, accent }) {
      const active = value > 0;
      const [burst, setBurst] = useState(null);

      const handleTap = () => {
        onTap();
        setBurst(Date.now());
      };

      return (
        <div
          className="relative flex flex-col items-center justify-center gap-1 rounded-2xl px-2 py-3 overflow-hidden select-none"
          style={{
            background: active ? `linear-gradient(155deg, ${accent}ee, ${accent}bb)` : "rgba(255,255,255,0.08)",
            border: active ? "1.5px solid rgba(255,255,255,0.85)" : "1.5px solid rgba(255,255,255,0.16)",
            boxShadow: active ? "0 4px 14px rgba(0,0,0,0.35)" : "none",
          }}
        >
          <button onPointerDown={(e) => { e.preventDefault(); handleTap(); }} className="flex flex-col items-center gap-1 w-full transition-transform duration-100 active:scale-95 touch-manipulation" style={{ touchAction: "manipulation" }}>
            <LucideIcon name="star" size={18} color="#FBF3DE" />
            <span className="text-[11px] tracking-wide font-semibold uppercase text-center leading-tight" style={{ color: "#FBF3DE" }}>Buona 10</span>
            <span className="text-[13px] font-bold" style={{ color: active ? "#FFF6DD" : "rgba(251,243,222,0.55)" }}>
              {active ? `x${value}` : "—"}
            </span>
          </button>
          {active && (
            <button onPointerDown={(e) => { e.preventDefault(); e.stopPropagation(); onReset(); }} className="absolute top-1 right-1 rounded-full flex items-center justify-center touch-manipulation" style={{ width: 22, height: 22, background: "rgba(0,0,0,0.85)", border: "1.5px solid rgba(255,255,255,0.7)", touchAction: "manipulation" }}>
              <LucideIcon name="rotate-ccw" size={13} color="#FFFFFF" />
            </button>
          )}
          {burst !== null && (
            <span key={burst} onAnimationEnd={() => setBurst(null)} className="cirulla-streak pointer-events-none absolute text-[20px] font-extrabold" style={{ color: "#FFF6DD" }}>
              +10
            </span>
          )}
        </div>
      );
    }

    function RunPopover({ title, cards, value, onSelect, onClose, accent, openDir }) {
      return (
        <div className={`absolute left-1/2 -translate-x-1/2 z-30 ${openDir === "up" ? "bottom-full mb-3" : "top-full mt-3"}`} style={{ width: "min(92vw, 420px)" }}>
          <div className="rounded-2xl p-3 shadow-2xl" style={{ background: "rgba(15,15,17,0.94)", border: "1px solid rgba(255,255,255,0.15)", backdropFilter: "blur(6px)" }}>
            <div className="flex items-center justify-between mb-2 px-1">
              <span className="text-[12px] font-bold tracking-wider uppercase" style={{ color: "#FBF3DE" }}>{title} · fino a che numero?</span>
              <button onPointerDown={(e) => { e.preventDefault(); onClose(); }} className="p-1 touch-manipulation" style={{ touchAction: "manipulation" }}><LucideIcon name="x" size={16} color="#FBF3DE" /></button>
            </div>
            <div className="flex gap-1.5 justify-center">
              {cards.map((c, i) => {
                const reached = i < value;
                return (
                  <button
                    key={c}
                    onPointerDown={(e) => { e.preventDefault(); onSelect(value === i + 1 ? 0 : i + 1); }}
                    className="relative flex flex-col items-center justify-center rounded-lg w-10 h-13 py-2 transition-all duration-150 active:scale-90 touch-manipulation"
                    style={{
                      background: reached ? `linear-gradient(160deg, ${accent}, ${accent}aa)` : "rgba(255,255,255,0.06)",
                      border: reached ? "1.5px solid rgba(255,255,255,0.9)" : "1.5px dashed rgba(255,255,255,0.25)",
                      touchAction: "manipulation",
                    }}
                  >
                    <LucideIcon name="coins" size={15} color={reached ? "#FFF6DD" : "rgba(251,243,222,0.35)"} />
                    <span className="text-[11px] font-bold mt-0.5" style={{ color: reached ? "#FFF6DD" : "rgba(251,243,222,0.35)" }}>{c}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    const WIN_THRESHOLD = 51;

    function CirullaScoreboard() {
      const [red, setRed] = useState(emptySide());
      const [blue, setBlue] = useState(emptySide());
      const [redTotal, setRedTotal] = useState(0);
      const [blueTotal, setBlueTotal] = useState(0);
      const [vittorie, setVittorie] = useState({ red: 0, blue: 0 });
      const [popover, setPopover] = useState(null);
      const [toast, setToast] = useState(null);
      const [confirmReset, setConfirmReset] = useState(false);
      const toastTimer = useRef(null);

      // Mantiene lo schermo attivo mentre l'app è in uso
      useEffect(() => {
        let wakeLock = null;
        let cancelled = false;

        const requestWakeLock = async () => {
          try {
            if ('wakeLock' in navigator) {
              const lock = await navigator.wakeLock.request('screen');
              if (cancelled) {
                lock.release().catch(() => {});
              } else {
                wakeLock = lock;
              }
            }
          } catch (err) {
            console.log('Wake Lock non disponibile:', err);
          }
        };

        requestWakeLock();

        const handleVisibility = () => {
          if (document.visibilityState === 'visible') {
            requestWakeLock();
          }
        };
        document.addEventListener('visibilitychange', handleVisibility);

        return () => {
          cancelled = true;
          document.removeEventListener('visibilitychange', handleVisibility);
          if (wakeLock) wakeLock.release().catch(() => {});
        };
      }, []);

      const redScore = redTotal + sideScore(red);
      const blueScore = blueTotal + sideScore(blue);

      const toggle = (side, key) => {
        const setter = side === "red" ? setRed : setBlue;
        setter((s) => ({ ...s, [key]: !s[key] }));
      };

      const setPiccola = (side, val) => {
        const setter = side === "red" ? setRed : setBlue;
        setter((s) => ({ ...s, piccola: val }));
        setPopover(null);
      };

      const bumpScope = (side) => {
        const setter = side === "red" ? setRed : setBlue;
        setter((s) => ({ ...s, scope: s.scope + 1 }));
      };

      const resetScope = (side) => {
        const setter = side === "red" ? setRed : setBlue;
        setter((s) => ({ ...s, scope: 0 }));
      };

      const bumpBuona = (side) => {
        const setter = side === "red" ? setRed : setBlue;
        setter((s) => ({ ...s, buona: s.buona + 1 }));
      };

      const resetBuona = (side) => {
        const setter = side === "red" ? setRed : setBlue;
        setter((s) => ({ ...s, buona: 0 }));
      };

      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 900);
      };

      const handleFineMano = useCallback(() => {
        const newRedTotal = redTotal + sideScore(red);
        const newBlueTotal = blueTotal + sideScore(blue);

        setRed(emptySide());
        setBlue(emptySide());
        setPopover(null);

        const redReached = newRedTotal >= WIN_THRESHOLD;
        const blueReached = newBlueTotal >= WIN_THRESHOLD;

        if (redReached && blueReached) {
          if (newRedTotal === newBlueTotal) {
            setRedTotal(newRedTotal);
            setBlueTotal(newBlueTotal);
            showToast("PAREGGIO A 51+ · SI CONTINUA");
          } else {
            const winner = newRedTotal > newBlueTotal ? "red" : "blue";
            setVittorie((v) => ({ ...v, [winner]: v[winner] + 1 }));
            setRedTotal(0);
            setBlueTotal(0);
            showToast(winner === "red" ? "ROSSO VINCE LA PARTITA" : "BLU VINCE LA PARTITA");
          }
        } else if (redReached) {
          setVittorie((v) => ({ ...v, red: v.red + 1 }));
          setRedTotal(0);
          setBlueTotal(0);
          showToast("ROSSO VINCE LA PARTITA");
        } else if (blueReached) {
          setVittorie((v) => ({ ...v, blue: v.blue + 1 }));
          setRedTotal(0);
          setBlueTotal(0);
          showToast("BLU VINCE LA PARTITA");
        } else {
          setRedTotal(newRedTotal);
          setBlueTotal(newBlueTotal);
          showToast("MANO AZZERATA");
        }
      }, [red, blue, redTotal, blueTotal]);

      const resetTutto = () => {
        setVittorie({ red: 0, blue: 0 });
        setRed(emptySide());
        setBlue(emptySide());
        setRedTotal(0);
        setBlueTotal(0);
        setPopover(null);
        setConfirmReset(false);
        showToast("PARTITA AZZERATA");
      };

      const RED = "#C1272D";
      const RED_ACCENT = "#E4572E";
      const BLUE = "#1B3B6F";
      const BLUE_ACCENT = "#2E6FE0";

      return (
        <div className="fixed inset-0 flex flex-col overflow-hidden">
          {/* ROSSO — Metà Superiore */}
          <div className="relative flex-1 basis-1/2 flex flex-col overflow-hidden" style={{ background: `radial-gradient(ellipse at 50% 0%, ${RED_ACCENT} 0%, ${RED} 55%, #6E1219 100%)` }}>
            <div className="relative flex flex-col flex-1 w-full h-full" style={{ transform: "rotate(180deg)" }}>
              <div className="flex flex-col items-center" style={{ paddingTop: 76 }}>
                <span className="cirulla-score leading-none" style={{ fontSize: "min(22vw, 108px)", color: "#FFF8EA" }}>{redScore}</span>
              </div>
              <div className="absolute left-4 top-6 flex flex-col items-center">
                <span className="text-[9px] font-bold tracking-widest uppercase" style={{ color: "rgba(255,255,255,0.8)" }}>Vittorie</span>
                <span className="cirulla-score leading-none" style={{ fontSize: 34, color: "#FFFFFF" }}>{vittorie.red}</span>
              </div>
              <div className="flex-1" />
              <div className="relative px-3 pb-1">
                {popover === "red-piccola" && (
                  <RunPopover title="Piccola" cards={PICCOLA_CARDS} value={red.piccola} onSelect={(v) => setPiccola("red", v)} onClose={() => setPopover(null)} accent={RED_ACCENT} openDir="up" />
                )}
                <div className="grid grid-cols-4 gap-2 mb-2">
                  <RunCell label="Piccola" iconName="chevrons-down" value={red.piccola} accent={RED_ACCENT} onOpen={() => setPopover(popover === "red-piccola" ? null : "red-piccola")} />
                  <ToggleCell label="Grande" iconName="chevrons-up" active={red.grande} points={5} accent={RED_ACCENT} onClick={() => toggle("red", "grande")} />
                  <ScopeCell value={red.scope} accent={RED_ACCENT} onTap={() => bumpScope("red")} onReset={() => resetScope("red")} />
                  <BuonaCell value={red.buona} accent={RED_ACCENT} onTap={() => bumpBuona("red")} onReset={() => resetBuona("red")} />
                </div>
                <div className="grid grid-cols-4 gap-2">
                  <ToggleCell label="Settebello" iconName="gem" active={red.settebello} showValue={false} accent={RED_ACCENT} onClick={() => toggle("red", "settebello")} />
                  <CustomToggleCell label="Primiera" active={red.primiera} accent={RED_ACCENT} onClick={() => toggle("red", "primiera")}><SevenIcon /></CustomToggleCell>
                  <ToggleCell label="Denari" iconName="coins" active={red.denari} showValue={false} accent={RED_ACCENT} onClick={() => toggle("red", "denari")} />
                  <ToggleCell label="Carte" iconName="layers" active={red.carte} showValue={false} accent={RED_ACCENT} onClick={() => toggle("red", "carte")} />
                </div>
              </div>
              <div className="flex flex-col items-center pt-1" style={{ paddingBottom: "max(env(safe-area-inset-top),16px)" }}>
                <span className="text-[14px] font-extrabold tracking-[0.35em]" style={{ color: "#FBE4C8" }}>ROSSO</span>
              </div>
            </div>
          </div>

          {/* BLU — Metà Inferiore */}
          <div className="relative flex-1 basis-1/2 flex flex-col overflow-hidden" style={{ background: `radial-gradient(ellipse at 50% 100%, ${BLUE_ACCENT} 0%, ${BLUE} 55%, #0B1830 100%)` }}>
            <div className="flex flex-col items-center" style={{ paddingTop: 76 }}>
              <span className="cirulla-score leading-none" style={{ fontSize: "min(22vw, 108px)", color: "#EAF1FF" }}>{blueScore}</span>
            </div>
            <div className="absolute right-4 top-6 flex flex-col items-center">
              <span className="text-[9px] font-bold tracking-widest uppercase" style={{ color: "rgba(255,255,255,0.8)" }}>Vittorie</span>
              <span className="cirulla-score leading-none" style={{ fontSize: 34, color: "#FFFFFF" }}>{vittorie.blue}</span>
            </div>
            <div className="flex-1" />
            <div className="relative px-3 pb-1">
              {popover === "blue-piccola" && (
                <RunPopover title="Piccola" cards={PICCOLA_CARDS} value={blue.piccola} onSelect={(v) => setPiccola("blue", v)} onClose={() => setPopover(null)} accent={BLUE_ACCENT} openDir="up" />
              )}
              <div className="grid grid-cols-4 gap-2 mb-2">
                <RunCell label="Piccola" iconName="chevrons-down" value={blue.piccola} accent={BLUE_ACCENT} onOpen={() => setPopover(popover === "blue-piccola" ? null : "blue-piccola")} />
                <ToggleCell label="Grande" iconName="chevrons-up" active={blue.grande} points={5} accent={BLUE_ACCENT} onClick={() => toggle("blue", "grande")} />
                <ScopeCell value={blue.scope} accent={BLUE_ACCENT} onTap={() => bumpScope("blue")} onReset={() => resetScope("blue")} />
                <BuonaCell value={blue.buona} accent={BLUE_ACCENT} onTap={() => bumpBuona("blue")} onReset={() => resetBuona("blue")} />
              </div>
              <div className="grid grid-cols-4 gap-2">
                <ToggleCell label="Settebello" iconName="gem" active={blue.settebello} showValue={false} accent={BLUE_ACCENT} onClick={() => toggle("blue", "settebello")} />
                <CustomToggleCell label="Primiera" active={blue.primiera} accent={BLUE_ACCENT} onClick={() => toggle("blue", "primiera")}><SevenIcon /></CustomToggleCell>
                <ToggleCell label="Denari" iconName="coins" active={blue.denari} showValue={false} accent={BLUE_ACCENT} onClick={() => toggle("blue", "denari")} />
                <ToggleCell label="Carte" iconName="layers" active={blue.carte} showValue={false} accent={BLUE_ACCENT} onClick={() => toggle("blue", "carte")} />
              </div>
            </div>
            <div className="flex flex-col items-center pb-[max(env(safe-area-inset-bottom),16px)] pt-1">
              <span className="text-[14px] font-extrabold tracking-[0.35em]" style={{ color: "#BFD3FA" }}>BLU</span>
            </div>
          </div>

          {/* Tasto Reset */}
          <button onPointerDown={(e) => { e.preventDefault(); setConfirmReset(true); }} className="absolute left-2 top-1/2 -translate-y-1/2 z-20 flex items-center justify-center p-2 transition-transform duration-150 active:scale-90 touch-manipulation" style={{ background: "transparent", border: "none", touchAction: "manipulation" }}>
            <LucideIcon name="rotate-ccw" size={26} color="#FFFFFF" />
          </button>

          {/* Centro: Fine Mano */}
          <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
            <button onPointerDown={(e) => { e.preventDefault(); handleFineMano(); }} className="rounded-full flex flex-col items-center justify-center transition-transform duration-150 active:scale-95 touch-manipulation" style={{ width: 84, height: 84, background: "#0B0B0C", border: "4px solid #FBF3DE", boxShadow: "0 6px 20px rgba(0,0,0,0.5)", touchAction: "manipulation" }}>
              <span className="text-[14px] font-extrabold tracking-wider leading-tight" style={{ color: "#FBF3DE" }}>FINE</span>
              <span className="text-[10px] font-bold tracking-widest leading-tight" style={{ color: "rgba(251,243,222,0.75)" }}>MANO</span>
            </button>
          </div>

          {toast && (
            <div className="cirulla-toast absolute left-1/2 top-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full pointer-events-none" style={{ marginTop: -84, background: "rgba(11,11,12,0.9)", border: "1px solid rgba(251,243,222,0.3)" }}>
              <span className="text-[12px] font-bold tracking-widest" style={{ color: "#FBF3DE" }}>{toast}</span>
            </div>
          )}

          {confirmReset && (
            <div className="absolute inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(0,0,0,0.6)" }}>
              <div className="w-full rounded-2xl p-5" style={{ maxWidth: 320, background: "rgba(15,15,17,0.97)", border: "1px solid rgba(255,255,255,0.15)", boxShadow: "0 10px 30px rgba(0,0,0,0.5)" }}>
                <div className="flex flex-col items-center gap-2 mb-4">
                  <LucideIcon name="alert-triangle" size={28} color="#FBF3DE" />
                  <span className="text-[15px] font-extrabold tracking-wide text-center" style={{ color: "#FBF3DE" }}>Ricominciare da capo?</span>
                  <span className="text-[12px] text-center" style={{ color: "rgba(251,243,222,0.65)" }}>Punteggi, vittorie e mano corrente verranno azzerati.</span>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <button
                    onPointerDown={(e) => { e.preventDefault(); setConfirmReset(false); }}
                    className="rounded-xl py-2.5 font-bold text-[13px] tracking-wide transition-all duration-150 active:scale-95 touch-manipulation"
                    style={{ background: "rgba(255,255,255,0.1)", border: "1.5px solid rgba(255,255,255,0.2)", color: "#FBF3DE", touchAction: "manipulation" }}
                  >
                    Annulla
                  </button>
                  <button
                    onPointerDown={(e) => { e.preventDefault(); resetTutto(); }}
                    className="rounded-xl py-2.5 font-bold text-[13px] tracking-wide transition-all duration-150 active:scale-95 touch-manipulation"
                    style={{ background: "linear-gradient(155deg, #E4572E, #C1272D)", border: "1.5px solid rgba(255,255,255,0.5)", color: "#FFF6DD", touchAction: "manipulation" }}
                  >
                    Sì, azzera
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CirullaScoreboard />);
  </script>
</body>
</html>
